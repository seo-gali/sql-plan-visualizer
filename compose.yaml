name: sqlpvi-test
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Public fixture password for this loopback-only test instance.
      MSSQL_SA_PASSWORD: "Sqlpvi-Fixture-2026!"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: "Sqlpvi-Fixture-2026!"
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "mssql", "-U", "sa", "-C", "-b", "-i", "/fixtures/sqlserver.sql"]
    volumes:
      - ./fixtures/database/sqlserver.sql:/fixtures/sqlserver.sql:ro
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: sqlpvi
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - ./fixtures/database/mariadb.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 45
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sqlpvi
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./fixtures/database/postgres.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
      - ./fixtures/database/postgres-enrichment.sql:/docker-entrypoint-initdb.d/02-enrichment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlpvi"]
      interval: 2s
      timeout: 3s
      retries: 30
